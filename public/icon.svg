<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with slight corner radius -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />
  
  <!-- Outer Shield Emblem -->
  <path d="M256 64 L384 128 V240 C384 328 328 404 256 448 C184 404 128 328 128 240 V128 Z" 
        fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linejoin="round" />
  
  <!-- Candlestick Graphic (Bullish Gold & Emerald) -->
  <line x1="216" y1="170" x2="216" y2="310" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <rect x="200" y="200" width="32" height="70" rx="4" fill="url(#goldGrad)" />

  <line x1="296" y1="150" x2="296" y2="330" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <rect x="280" y="180" width="32" height="90" rx="4" fill="url(#emeraldGrad)" />

  <!-- Trend Pulse Accent -->
  <polyline points="176,280 216,240 256,260 296,210 336,180" 
            fill="none" stroke="#f4f4f5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="336" cy="180" r="10" fill="#34d399" stroke="#ffffff" stroke-width="4" />
</svg>
